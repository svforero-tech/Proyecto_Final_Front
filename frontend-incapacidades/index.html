<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Corporate Solutions - Gestión de Incapacidades</title>
  <link rel="stylesheet" href="css/msg.css" />
  <link rel="stylesheet" href="css/forms.css" />
  <link rel="stylesheet" href="css/modals.css" />
</head>
<body>
  <header id="navbar" style="display: none;">
    <nav aria-label="Navegación principal">
      <button type="button" class="btn btn--secondary" data-view="empleados">Empleados</button>
      <button type="button" class="btn btn--secondary" data-view="incapacidades">Incapacidades</button>
      <button type="button" class="btn btn--secondary" data-view="seguimiento">Seguimiento</button>
      <button type="button" class="btn btn--secondary" id="btnLogout">Cerrar sesión</button>
    </nav>
  </header>

  <main id="app">
    <div id="alertBox"></div>

    <!-- Vista de inicio de sesión -->
    <section id="loginSection">
      <h1>Iniciar sesión</h1>
      <form id="loginForm">
        <div class="form-group">
          <label for="identificador">Usuario o correo</label>
          <input type="text" id="identificador" name="identificador" required />
        </div>
        <div class="form-group">
          <label for="contrasena">Contraseña</label>
          <input type="password" id="contrasena" name="contrasena" required />
        </div>
        <button type="submit" class="btn btn--primary">Ingresar</button>
      </form>
    </section>

    <!-- Vista de empleados -->
    <section id="empleadosSection" style="display: none;">
      <h2>Gestión de empleados</h2>
      <div id="empleadosLista"></div>
    </section>

    <!-- Placeholders para siguientes módulos -->
    <section id="incapacidadesSection" style="display: none;">
      <h2>Gestión de incapacidades</h2>
    </section>

    <section id="seguimientoSection" style="display: none;">
      <h2>Seguimiento y trazabilidad</h2>
    </section>
  </main>

  <script type="module" src="js/auth.js"></script>
  <script type="module" src="js/empleados.js"></script>
</body>
</html>
